# ClipAI en Docker: docker compose up --build   →   http://127.0.0.1:3000
#
# - Solo la interfaz se publica, y solo en 127.0.0.1. El servicio de procesamiento
#   queda dentro de la red de Compose (sin login: nunca debe exponerse).
# - Tus videos y clips viven en ./data (carpeta de tu equipo; cámbiala con DATA_PATH); la base de datos, en el
#   volumen `clipai-db`. Los ajustes salen de .env (copia .env.example).
x-app-env: &app-env
  # Puerto en TU equipo: el filtro anti-CSRF compara el Origin del navegador con él.
  WEB_PORT: ${WEB_PORT:-3000}
  MEDIA_PORT: 8000
  # `media` es el nombre con que la web llama al servicio; se suman los de tu .env.
  ALLOWED_HOSTS: media${ALLOWED_HOSTS:+,${ALLOWED_HOSTS}}
  DATA_DIR: /app/data
  DATABASE_URL: file:/app/db/app.db
  MEDIA_API_URL: http://media:8000
  MEDIA_HOST: 0.0.0.0
  # Sin navegador ni FFmpeg del equipo dentro del contenedor.
  FFMPEG_BIN: ""
  FFPROBE_BIN: ""
  YTDLP_COOKIES_FROM_BROWSER: ""

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: clipai-web
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "${CLIPAI_UID:-1000}:${CLIPAI_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment: *app-env
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - clipai-db:/app/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/projects"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  media:
    build:
      context: .
      dockerfile: docker/media.Dockerfile
    image: clipai-media
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "${CLIPAI_UID:-1000}:${CLIPAI_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      web:
        condition: service_healthy   # la web crea y migra la base de datos antes
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - clipai-db:/app/db
    stop_grace_period: 30s

volumes:
  clipai-db:
